name: Stream channel health

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      target_channel:
        description: "Optional single channel name to re-check (overrides TARGET_CHANNELS). Leave empty for the full scheduled sweep."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event.inputs.target_channel != '' && format('channel-health-single-{0}', github.event.inputs.target_channel) || 'channel-health-monitor' }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    # Firefox discovers notably more cards than Chromium (~93 vs ~46) and costs ~24s per
    # inspected card (measured: 6 cards in 146s vs Chromium's 1 card in 62s). A full
    # 12-channel sweep can therefore run long, so leave generous headroom — a timeout
    # wastes the entire run, an unused ceiling costs nothing.
    timeout-minutes: 60
    env:
      BROWSER_CHANNEL: chrome
      # "chromium" (default) or "firefox". The site appears to fingerprint the browser
      # rather than block IPs: Firefox is a very different engine/CDP surface and is far
      # harder to sniff out. Verified locally: SKY SPORT 1 NZ healthy on Firefox, no proxy.
      BROWSER_TYPE: ${{ vars.BROWSER_TYPE || 'chromium' }}
      # Optional normal-looking UA. Headless builds often advertise themselves.
      BROWSER_USER_AGENT: ${{ vars.BROWSER_USER_AGENT }}
      CHANNEL_TIMEOUT_MS: "90000"
      FAIL_ON_UNHEALTHY: "false"
      HEADLESS: ${{ vars.HEADLESS_MODE || 'new' }}
      PLAYER_MODE: ${{ vars.PLAYER_MODE }}
      HEALTH_REPORT_ENDPOINT: ${{ secrets.HEALTH_REPORT_ENDPOINT }}
      HEALTH_REPORT_TOKEN: ${{ secrets.HEALTH_REPORT_TOKEN }}
      PLAYWRIGHT_STORAGE_STATE_BASE64: ${{ secrets.PLAYWRIGHT_STORAGE_STATE_BASE64 }}
      # Stream resolution is gated mainly by ANTI-BOT/FINGERPRINTING, not (only) by IP:
      # headless Chromium on a runner can fail while Firefox passes with no proxy at all.
      # Prefer switching BROWSER_TYPE to firefox first; a proxy is the belt-and-braces
      # fallback. Credentials are secrets; leave the server unset to run without a proxy.
      # The proxy server prefers the secret but falls back to a repo VARIABLE: public
      # proxies rotate often, and a variable is read/write so it can be refreshed without
      # re-entering a write-only secret. Verified working: socks5://144.126.197.184:1088 (GB).
      PLAYWRIGHT_PROXY_SERVER: ${{ secrets.PLAYWRIGHT_PROXY_SERVER || vars.PLAYWRIGHT_PROXY_SERVER }}
      PLAYWRIGHT_PROXY_USERNAME: ${{ secrets.PLAYWRIGHT_PROXY_USERNAME }}
      PLAYWRIGHT_PROXY_PASSWORD: ${{ secrets.PLAYWRIGHT_PROXY_PASSWORD }}
      PLAYWRIGHT_PROXY_BYPASS: ${{ vars.PLAYWRIGHT_PROXY_BYPASS }}
      TARGET_CHANNELS: ${{ github.event.inputs.target_channel != '' && github.event.inputs.target_channel || vars.TARGET_CHANNELS }}
      TARGET_STREAM_URL: ${{ vars.TARGET_STREAM_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser dependencies
        run: npx playwright install --with-deps chrome firefox

      - name: Validate JavaScript
        run: npm run check

      - name: Run channel health monitor
        run: npm run monitor

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-health-${{ github.run_id }}
          path: artifacts/channel-health.json
          if-no-files-found: warn
          retention-days: 14
