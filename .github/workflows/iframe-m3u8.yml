name: iframe m3u8 capture (2h)

# Captures HLS (.m3u8) playlists from embed iframes (e.g. https://epiembeds.online/embed/fox-sports-1).
# Reuses the SAME capture script and the SAME report endpoint/token as the 5-hour
# channel-playlist workflow (channel-playlist.yml); the only differences are the
# 2-hour cadence and PLAYLIST_MATCH_MODE=any (matches any url ending in .m3u8, not
# just /playlist.m3u8). The embedded m3u8 links expire ~2h30m, hence the 2h schedule.

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      iframe_targets:
        description: "Optional JSON array of {slug,url} embed targets (overrides IFRAME_M3U8_TARGETS). Leave empty for the scheduled sweep."
        required: false
        type: string
      playlist_max_retries:
        description: "Max page refreshes per channel when no m3u8 200 is observed (502/503/timeout)."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: channel-iframe-playlist-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BROWSER_CHANNEL: chrome
      HEADLESS: ${{ vars.HEADLESS_MODE || 'new' }}
      # Match ANY url ending in .m3u8 (iframe embeds), not only /playlist.m3u8.
      PLAYLIST_MATCH_MODE: any
      PLAYLIST_MAX_RETRIES: ${{ github.event.inputs.playlist_max_retries != '' && github.event.inputs.playlist_max_retries || vars.PLAYLIST_MAX_RETRIES }}
      # Feed the dedicated iframe-embed repo variable into the shared PLAYLIST_TARGETS
      # env var so the existing capture script reads it unchanged.
      PLAYLIST_TARGETS: ${{ github.event.inputs.iframe_targets != '' && github.event.inputs.iframe_targets || vars.IFRAME_M3U8_TARGETS }}
      PLAYLIST_CAPTURE_TIMEOUT_MS: ${{ vars.PLAYLIST_CAPTURE_TIMEOUT_MS }}
      NAVIGATION_TIMEOUT_MS: ${{ vars.NAVIGATION_TIMEOUT_MS }}
      PLAYWRIGHT_STORAGE_STATE_BASE64: ${{ secrets.PLAYWRIGHT_STORAGE_STATE_BASE64 }}
      # Same endpoint + same token as the 5-hour channel-playlist workflow.
      HEALTH_REPORT_ENDPOINT: ${{ secrets.PLAYLIST_REPORT_ENDPOINT }}
      HEALTH_REPORT_TOKEN: ${{ secrets.HEALTH_REPORT_TOKEN }}
      # Distinct path so this run never clobbers the 5-hour channel-playlist.json.
      HEALTH_REPORT_PATH: artifacts/channel-iframe-playlist.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium dependencies
        run: npx playwright install --with-deps chrome

      - name: Validate JavaScript
        run: npm run check

      - name: Run iframe m3u8 capture
        run: npm run playlist

      - name: Upload iframe playlist report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: channel-iframe-playlist-${{ github.run_id }}
          path: artifacts/channel-iframe-playlist.json
          if-no-files-found: warn
          retention-days: 14
